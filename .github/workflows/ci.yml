name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: [self-hosted, Linux, X64, atilproject]

    steps:
      - name: Checkout
        # SHA-pinned per ADR-0027 §Threat model + ADR-0043 §lens (h).
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # -------------------------------------------------------------------------
      # Issue #27 (P1) — CI was previously gated solely on `package.json`,
      # which silently no-op'd every Python PR. Detection now emits a flag
      # per language; all subsequent steps gate on their own flag.
      # Regression pin: scripts/tests/ci-detects-pyproject.sh
      # -------------------------------------------------------------------------
      - name: Detect project type
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "node=true" >> $GITHUB_OUTPUT
          else
            echo "node=false" >> $GITHUB_OUTPUT
          fi
          if [ -f pyproject.toml ]; then
            echo "python=true" >> $GITHUB_OUTPUT
          else
            echo "python=false" >> $GITHUB_OUTPUT
          fi

      # --- Node.js path (unchanged from prior to issue #27) ---------------------
      - name: Setup Node.js
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.detect.outputs.node == 'true'
        run: npm ci

      - name: Lint (Node)
        if: steps.detect.outputs.node == 'true'
        run: |
          if npm run --silent 2>&1 | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script found — skipping"
          fi

      - name: Test (Node)
        if: steps.detect.outputs.node == 'true'
        run: |
          if npm run --silent 2>&1 | grep -q "test"; then
            npm test
          else
            echo "No test script found — skipping"
          fi

      # --- Python path (added by issue #27 fix) --------------------------------
      # Per ADR-0017 §CI: ruff check → mypy --strict src/atilcalc/engine → pytest.
      # Python version pinned to 3.12 to match .python-version + the dev venv.
      - name: Setup Python
        if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        if: steps.detect.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          # Editable install with [dev] extra (per pyproject.toml). Engine stays
          # stdlib-only at runtime, so this is the only install step.
          pip install -e ".[dev]"

      - name: Lint (Python)
        # Skip if no Python source files (e.g. workflow-only PRs like the one
        # that introduced this fix). ruff exits 0 on an empty tree, but mypy
        # and pytest exit non-zero, so we gate all three on file presence.
        if: steps.detect.outputs.python == 'true' && hashFiles('src/**/*.py') != ''
        run: ruff check .

      - name: Type-check (Python)
        if: steps.detect.outputs.python == 'true' && hashFiles('src/atilcalc/engine/**/*.py') != ''
        run: mypy --strict src/atilcalc/engine

      - name: Test (Python)
        if: steps.detect.outputs.python == 'true' && hashFiles('tests/**/*.py') != ''
        # Issue #727 (Sprint 22 PIVOT ci.yml env gap from PR #709 cascade) +
        # Issue #728 architect Path 2 fixup (cycle ~#1761). `vars.BUDGET_MULTIPLIER`
        # (Settings > Secrets and variables > Variables) lets operators tune the
        # d100 perf-budget multiplier without code changes. Default 2.0 =
        # Sprint 22 PIVOT self-hosted runner canonical multiplier (ADR-0019
        # amend 3 §Runner-aware multipliers); operators can still override via
        # vars.BUDGET_MULTIPLIER if GH-hosted or different multiplier needed.
        # Issue #739 follow-up + TD-046-extension (cycle ~#1770+): same env-var
        # gap applied to SUBPROCESS_TIMEOUT_S. tests/conftest.py:144
        # _resolve_subprocess_timeout_s() takes the canonical 3-tier precedence
        # chain (env var > runner detection > hardcoded map), but ci.yml never
        # propagated the env var — so detect_runner_env() returned 'self-hosted'
        # → SUBPROCESS_TIMEOUT_S=10.0s in module-level default, but e2e tests
        # in tests/e2e/ derived cleanup_timeout=max(int(SUBPROCESS_TIMEOUT_S/5),1)
        # = max(int(10/5),1) = 2s on local vs 1s on CI when detect_runner_env()
        # drifted (cycle ~#1966 hand-off, PR #732 cascade). Default 10.0 =
        # Sprint 22 PIVOT self-hosted canonical baseline (tests/conftest.py:120
        # _SUBPROCESS_TIMEOUT_MAP_S['self-hosted']=10.0), matching BUDGET_MULTIPLIER
        # sister-pattern. Sister-pattern to d109 (BUDGET_MULTIPLIER env block,
        # PR #729 commit f5636d5) + d112 (conftest env-var precedence).
        env:
          BUDGET_MULTIPLIER: ${{ vars.BUDGET_MULTIPLIER || 2.0 }}
          SUBPROCESS_TIMEOUT_S: ${{ vars.SUBPROCESS_TIMEOUT_S || 10.0 }}
          # Issue #954 closeout (STORY-S26-003 AC7, ADR-0019 amend-5
          # Sprint 26 wave 1 acceptance). Self-hosted runner perf-budget
          # bleed under pytest-cov instrumentation: arithmetic p99
          # 500-815ms over 250ms budget. The ATILCALC_EVALUATE_PERSIST
          # env-var gate (PR #742 impl, src/atilcalc/api/routes.py:353)
          # allows opt-out of SQLite write on the perf-critical path.
          # Default 'false' on CI = opt-out (CI is perf-test environment,
          # not production durability path). Operators can override to
          # 'true' via vars.ATILCALC_EVALUATE_PERSIST if persistence
          # coverage is needed. Sister-pattern to BUDGET_MULTIPLIER
          # + SUBPROCESS_TIMEOUT_S env-block above (TD-046-extension).
          ATILCALC_EVALUATE_PERSIST: ${{ vars.ATILCALC_EVALUATE_PERSIST || 'false' }}
        run: |
          # pytest-cov reads configuration from pyproject.toml [tool.coverage.*]
          # and [tool.pytest.ini_options]. The --cov-fail-under matches the
          # ≥90% engine coverage gate (STORY-002 AC8).
          pytest -q --cov=src/atilcalc/engine --cov-fail-under=90

      # --- No-source sentinel (now correctly gated on BOTH flags being false) --
      - name: No source yet
        if: steps.detect.outputs.node == 'false' && steps.detect.outputs.python == 'false'
        run: echo "📦 No package.json or pyproject.toml yet — repo scaffold only. CI will run actual checks once code is added."

  conventional-commits:
    name: Conventional Commits
    runs-on: [self-hosted, Linux, X64, atilproject]
    if: github.event_name == 'pull_request'

    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825  # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
            build
            revert
